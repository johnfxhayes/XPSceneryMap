name: Mac build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mac/1.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller pywebview

      - name: Scan a sample airport
        run: python check_scan.py

      - name: Build the app
        run: pyinstaller --noconfirm XPSceneryMap.spec

      - name: Zip the app
        run: ditto -c -k --keepParent dist/XPSceneryMap.app XPSceneryMap-Mac-1.1.zip

      - uses: actions/upload-artifact@v4
        with:
          name: XPSceneryMap-Mac-1.1
          path: mac/1.1/XPSceneryMap-Mac-1.1.zip
          if-no-files-found: error
